apiVersion: v1
kind: Service
metadata:
  name: yosoydbadmin
  namespace: default

spec:
  ports:
    - protocol: TCP
      name: web
      port: 80
  selector:
    app: yosoydbadmin

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yosoydbadmin
  namespace: default
  labels:
    app: yosoydbadmin

spec:
  replicas: 1
  selector:
    matchLabels:
      app: yosoydbadmin
  template:
    metadata:
      labels:
        app: yosoydbadmin
    spec:
      containers:
        - name: yosoydbadmin
          image: phpmyadmin/phpmyadmin
          env:
            - name: PMA_HOST
              value: "yo-soy.cdcwmzmjjdqh.us-east-1.rds.amazonaws.com"
            - name: PMA_PORT
              value: "3306"
            - name: UPLOAD_LIMIT
              value: "1000M"
          ports:
            - name: web
              containerPort: 80

---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-yosoydbadmin
  namespace: default
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`dbadmin.yo-soy.co`)
    kind: Rule
    services:
    - name: yosoydbadmin
      port: 80

---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-yosoydbadmin-secure
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`dbadmin.yo-soy.co`)
    kind: Rule
    services:
    - name: yosoydbadmin
      port: 80
  tls:
    certResolver: default
