apiVersion: apps/v1
kind: Deployment
metadata:
  name: yosoyapp
  namespace: default
  labels:
    app: yosoyapp

spec:
  replicas: 1
  selector:
    matchLabels:
      app: yosoyapp
  template:
    metadata:
      labels:
        app: yosoyapp
    spec:
      containers:
        - name: yosoyapp
          image: 301002166745.dkr.ecr.us-east-1.amazonaws.com/yosoyapp:latest
          env:
            - name: APP_NAME
              value: "Laravel"
            - name: APP_ENV
              value: "production"
            - name: APP_KEY
              value: "base64:fUs+diAQPs0eZo2Ufgihmh1tLFMmUp9cdP5SC12FymA="
            - name: APP_URL
              value: "https://app.yo-soy.co"
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "yo-soy.cdcwmzmjjdqh.us-east-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "yosoy"
            - name: DB_USERNAME
              value: "admin"
            - name: DB_PASSWORD
              value: "2eGhvW3WNjGYJ&%"
            - name: LOG_CHANNEL
              value: "stack"
            - name: LOG_LEVEL
              value: "debug"
            - name: APP_DEBUG
              value: "false"
            - name: API_FLAG
              value: "true"
            - name: WEB_FLAG
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              value: "AKIARJ7XHYQR47WT3DER"
            - name: AWS_SECRET_ACCESS_KEY
              value: "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"
            - name: AWS_DEFAULT_REGION
              value: "us"-east-2"
            - name: AWS_BUCKET
              value: "authenticlibreria"
            - name: AWS_USE_PATH_STYLE_ENDPOINT
              value: "false"
          ports:
            - name: web
              containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "400m"
            limits:
              memory: "128Mi"
              cpu: "950m"
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "php artisan migrate --force && php artisan passport:install"]
